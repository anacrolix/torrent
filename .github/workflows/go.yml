name: Go

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs when a PR gets new commits. Pushes to master and tags
# always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: [ stable, oldstable]
        # windows-latest removed for now: known issues with file handles to
        # resolved. could set classic file io mode.
        os: [macos-latest, ubuntu-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          # Replaced by go-test-cache, which also saves updated test results.
          cache: false
      - uses: ./.github/actions/go-test-cache
      # The FUSE casks download installers from GitHub releases, which
      # intermittently return 504s. Cache the downloads per cask version, and
      # retry the install, so a flaky download doesn't fail the job.
      - name: Resolve FUSE cask versions
        id: fuse-casks
        if: matrix.os == 'macos-latest'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          echo "key=$(brew info --cask --json=v2 macfuse fuse-t | jq -r '[.casks[] | .token + "-" + .version] | join("_")')" >> "$GITHUB_OUTPUT"
          echo "cache=$(brew --cache)/downloads" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: matrix.os == 'macos-latest'
        with:
          path: ${{ steps.fuse-casks.outputs.cache }}
          key: brew-casks-${{ runner.os }}-${{ runner.arch }}-${{ steps.fuse-casks.outputs.key }}
      - name: Install FUSE
        if: matrix.os == 'macos-latest'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          for attempt in 1 2 3 4; do
            brew install macfuse fuse-t && break
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep $((attempt * 30))
          done
          echo 'FUSE_FORCE_BACKEND=fuse-t' >> "$GITHUB_ENV"
      - run: |
          sudo apt update
          sudo apt install -y fuse
        if: matrix.os == 'ubuntu-latest'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: storage/possum/lib
      # Prebuilt binary, rather than compiling just from source every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Build possum
        run: |
          cd storage/possum/lib
          cargo build --lib
      # Separate to remove downloading spam and possible caching improvement.
      - run: go mod download
      - run: just test
      # Modules under tests/ with their own go.mod are skipped by ./... and need
      # manual setup to run, so at least check they compile against this checkout.
      - name: Vet separate test modules
        run: go vet $(for m in tests/*/go.mod; do echo "./${m%/go.mod}"; done)
        # Test on 386 for atomic alignment and other bad 64-bit assumptions
      - if: matrix.os != 'macos-latest'
        run: GOARCH=386 go test -run @ ./...
      - name: Some packages compile for WebAssembly
        run: GOOS=js GOARCH=wasm go build . ./storage ./tracker/...
      - name: Builds without WebTorrent
        run: go test -tags nowebtorrent -run @ .

      - name: Test global installability
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Create isolated environment
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"

          # Init a dummy module to avoid any local go.mod influence
          go mod init dummy

          # This should succeed if your module is properly published
          go install github.com/anacrolix/torrent/cmd/torrent@${{ github.ref_name }}

          # Verify it runs
          $(go env GOPATH)/bin/torrent version
