name: Windows

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs when a PR gets new commits. Pushes to master and tags
# always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 20
    runs-on: windows-latest
    strategy:
      matrix:
        go-version: [stable, oldstable]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Fix Windows dynamic port range
        shell: pwsh
        run: |
          netsh int ipv4 set dynamicport tcp start=20000 num=16384
          netsh int ipv4 set dynamicport udp start=20000 num=16384
      - run: go mod download
      - name: Test packages
        run: go test -count=1 ./...
        env:
          CGO_ENABLED: "0"
